name: StartupGraph
options:
  bundleIdPrefix: dev.startupgraph
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  StartupGraph:
    type: application
    platform: iOS
    sources:
      - StartupGraph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.startupgraph.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: StartupGraph/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: StartupGraph
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
